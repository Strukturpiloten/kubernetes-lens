# Versions and lock integrity belong to BoxFerry's immutable automation project.
[tool.ruff]
target-version = "py313"
line-length = 100
include = [
  "scripts/shared-ci.py",
  "scripts/validation-plan.py",
  "scripts/ci-api-transition.py",
  "scripts/test-validation-plan.py",
  "scripts/test-shared-automation.py",
  "scripts/test-repository-policy.py",
  "scripts/test-check-all.py",
  "scripts/test-ci-tools.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = [
  "scripts/shared-ci.py",
  "scripts/validation-plan.py",
  "scripts/ci-api-transition.py",
  "scripts/test-validation-plan.py",
  "scripts/test-shared-automation.py",
  "scripts/test-repository-policy.py",
  "scripts/test-check-all.py",
  "scripts/test-ci-tools.py",
]

[tool.ty.terminal]
error-on-warning = true
