---
name: Hosted prerequisite observation

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact independently reviewed main commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  observe:
    name: Observe hosted prerequisites (never native admission)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse any candidate other than the exact reviewed main revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPOSITORY" == Strukturpiloten/kubernetes-lens && "$EVENT" == workflow_dispatch && "$REF" == refs/heads/main ]]
          [[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" && "$WORKFLOW_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$WORKFLOW_REF" == Strukturpiloten/kubernetes-lens/.github/workflows/hosted-native-prerequisites.yml@refs/heads/main ]]
      - name: Check out only the exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect bounded read-only indicators
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          HN_SOURCE_SHA: ${{ github.sha }}
          HN_WORKFLOW_SHA: ${{ github.workflow_sha }}
          HN_WORKFLOW_REF: ${{ github.workflow_ref }}
          HN_REPOSITORY: ${{ github.repository }}
          HN_EVENT: ${{ github.event_name }}
          HN_REF: ${{ github.ref }}
          HN_RUN_ID: ${{ github.run_id }}
          HN_RUN_ATTEMPT: ${{ github.run_attempt }}
          HN_RUNNER_OS: ${{ runner.os }}
          HN_RUNNER_ARCH: ${{ runner.arch }}
          HN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          exec env -i PATH=/usr/bin:/bin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
            HN_SOURCE_SHA="$HN_SOURCE_SHA" HN_WORKFLOW_SHA="$HN_WORKFLOW_SHA" \
            HN_WORKFLOW_REF="$HN_WORKFLOW_REF" HN_REPOSITORY="$HN_REPOSITORY" \
            HN_EVENT="$HN_EVENT" HN_REF="$HN_REF" HN_RUN_ID="$HN_RUN_ID" \
            HN_RUN_ATTEMPT="$HN_RUN_ATTEMPT" HN_RUNNER_OS="$HN_RUNNER_OS" \
            HN_RUNNER_ARCH="$HN_RUNNER_ARCH" HN_RUNNER_ENVIRONMENT="$HN_RUNNER_ENVIRONMENT" \
            HN_ImageOS="${ImageOS:-}" HN_ImageVersion="${ImageVersion:-}" \
            /usr/bin/python3 -B scripts/fixtures/hosted_native_prerequisites.py \
            --expected-source-sha "$EXPECTED_SOURCE_SHA"
