---
name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate unpublished package
    uses: ./.github/workflows/ci.yml
    with:
      api_purpose: published
    permissions:
      contents: read
      actions: read
      statuses: read

  release-gate:
    name: Complete exact-candidate release gate
    needs: validate
    uses: Strukturpiloten/boxferry/.github/workflows/shared-release-validation.yml@9eb757145e7e078ba8944df525c9884eec87effc # automation-v1 interface v1
    with:
      candidate_sha: ${{ github.sha }}
      automation_sha: 9eb757145e7e078ba8944df525c9884eec87effc
      policy_sha: ${{ github.sha }}
      config_path: scripts/release-policy.json
      needs_json: ${{ toJSON(needs) }}
