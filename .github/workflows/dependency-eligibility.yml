---
name: Dependency eligibility

on: # zizmor: ignore[dangerous-triggers] -- Trusted listener delegates only immutable shared code; it never executes candidate code.
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [CI]
    types: [requested, completed]

permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write

concurrency:
  group: dependency-eligibility
  cancel-in-progress: false

jobs:
  eligibility:
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group'))
    uses: Strukturpiloten/boxferry/.github/workflows/shared-dependency-eligibility.yml@fba206d732ea7ed9373386ae58101e76e1e3c9fb # automation-v1 interface v1
    with:
      automation-sha: fba206d732ea7ed9373386ae58101e76e1e3c9fb
