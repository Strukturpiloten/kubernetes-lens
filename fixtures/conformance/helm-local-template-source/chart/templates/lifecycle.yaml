---
# SPDX-License-Identifier: MPL-2.0
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-lifecycle
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: {{ if .Release.IsInstall }}"pre-install"{{ else }}"pre-upgrade"{{ end }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lifecycle
          image: {{ .Values.hookImage | quote }}
          command: ["/bin/true"]
